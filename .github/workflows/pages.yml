name: Deploy COMBAT ZONE to GitHub Pages
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: "pages"
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Install 3D models from the supplied asset pack
        shell: bash
        run: |
          archive=""
          for candidate in COMBAT_ZONE_6_6_REPARADO_2.zip COMBAT_ZONE_6_6_RECONSTRUIDO.zip; do
            if [ -f "$candidate" ]; then archive="$candidate"; break; fi
          done
          if [ -z "$archive" ]; then
            echo "::error::No se encontró el paquete de modelos 3D esperado en la raíz del repositorio."
            ls -lah
            exit 1
          fi
          echo "Usando paquete: $archive"
          mkdir -p /tmp/combat-zone-assets
          unzip -q "$archive" -d /tmp/combat-zone-assets
          source_dir="$(find /tmp/combat-zone-assets -type d -path '*/assets/buildings' -print -quit | sed 's#/assets/buildings$##')"
          if [ -z "$source_dir" ] || [ ! -d "$source_dir/assets/vehicles" ] || [ ! -d "$source_dir/assets/weapons" ] || [ ! -d "$source_dir/assets/characters" ]; then
            echo "::error::El ZIP no contiene todas las carpetas de modelos requeridas."
            exit 1
          fi
          rm -rf assets
          cp -a "$source_dir/assets" ./assets
          echo "Modelos instalados:"
          find assets -type f | wc -l
      - name: Setup Node.js for browser tests
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright and Chromium
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Run 50 browser smoke tests
        run: node tests/smoke.mjs
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
